<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap"
    />
    <title>MyReps</title>
    <script>
      // Pasang tema pilihan (lib/theme.ts) sebelum render supaya layar tidak berkedip putih
      try {
        var t = localStorage.getItem('myrep:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      /* Layar pembuka (lib/boot.ts): menyambung splash bawaan HP, menahan logo sebentar, lalu memudar */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #111111;
        will-change: opacity;
      }
      #boot svg {
        width: 58px;
        height: 80px;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 72 100"><path fill="#FFFFFF" fill-rule="evenodd" d="M22 0H44A28 28 0 0 1 44 56H22ZM22 18V38H42A10 10 0 0 0 42 18Z" /><path fill="#FFFFFF" d="M30 56H49L70 100H51Z" /><rect x="10" y="8" width="12" height="84" fill="#FFFFFF" /><rect x="1.5" y="1.5" width="29" height="17" rx="4" fill="#C8F169" stroke="#111111" stroke-width="3" /><rect x="1.5" y="81.5" width="29" height="17" rx="4" fill="#C8F169" stroke="#111111" stroke-width="3" /></svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
