# Jalankan dari root repo (panduan lengkap: docs/DEPLOY.md):
#   docker compose up -d --build   (.env di root dibaca otomatis)
services:
  be:
    build:
      context: .
      dockerfile: BE/Dockerfile
    env_file: .env
    environment:
      PORT: 3000
      # Menimpa BETTER_AUTH_URL lokal (localhost) di .env: di server selalu https://DOMAIN
      BETTER_AUTH_URL: https://${DOMAIN:?isi DOMAIN di .env}
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    # Image Caddy berisi hasil build FE, lihat FE/Dockerfile
    build:
      context: .
      dockerfile: FE/Dockerfile
    depends_on:
      - be
    environment:
      DOMAIN: ${DOMAIN:?isi DOMAIN di .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
